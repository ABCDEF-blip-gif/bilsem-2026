<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Profili</title>
    <style>
        body {
            background-color: #e0f2fe;
            color: #0f172a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        h3 {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            font-weight: normal;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        ul {
            list-style-type: disc;
            padding: 0;
            margin: 0;
            display: inline-block;
            text-align: left;
        }
        li {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <h1>[Adın]</h1>
    <h3>ÖYG-2 · 2026-2027</h3>
    <h2>İlgi alanlarım</h2>
    <ul>
        <li>[ilgi 1]</li>
        <li>[ilgi 2]</li>
        <li>[ilgi 3]</li>
    </ul>
</body>
</html>
